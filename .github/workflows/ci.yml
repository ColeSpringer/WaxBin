name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      # Let each OS report on its own; a Windows-only failure is a real signal
      # (chmod, flock, and clock semantics all differ there), not a reason to
      # cancel the Linux run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # One shell for both runners, so the gofmt and grep steps stay a single
        # spelling. .gitattributes pins eol=lf, so the Windows checkout is
        # byte-identical and gofmt agrees across the matrix.
        shell: bash
    env:
      CGO_ENABLED: "0" # WaxBin is strictly no-CGO
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: No-CGO invariant
        # The shipped binaries must never link cgo. CGO_ENABLED=0 is the job
        # default, so this asserts no package pulled runtime/cgo into the graph.
        run: |
          go build ./...
          if go list -deps ./... | grep -qx runtime/cgo; then
            echo "runtime/cgo is linked into a CGO_ENABLED=0 build"; exit 1
          fi

      - name: Test (race)
        # The race detector needs cgo; scope it to the test toolchain only so the
        # shipped binaries stay pure no-CGO.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
