name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/**"]
  pull_request:
    paths-ignore: ["*.md", "docs/**"]
  schedule:
    # Weekly, so a new Go patch release, runner image, or published
    # vulnerability shows up even in a week with no pushes.
    - cron: "23 7 * * 1"
  workflow_dispatch:
  workflow_call:
    outputs:
      go-version:
        description: The exact Go release the checks ran on
        value: ${{ jobs.checks.outputs.go-version }}

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. Every other run gets a
  # group of its own, so each commit on main keeps its result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # Set explicitly so every step, Windows included, runs under bash -eo pipefail.
    shell: bash

env:
  CGO_ENABLED: "0" # WaxBin is strictly no-CGO

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        id: go
        with:
          go-version: "1.26"
          # The newest 1.26 patch straight from go.dev. setup-go's manifest trails a Go
          # release by about a day, and govulncheck knows the fixed version the moment
          # it is out, so a push in that day failed the gate on the previous patch.
          # check-latest is ignored with a custom URL; the listing is read fresh.
          # The token is cleared because setup-go sends it with a custom URL's
          # download, and go.dev has no use for the job's token.
          go-download-base-url: https://go.dev/dl
          token: ""
          # The Linux test job uses the same cache key, and its race builds are
          # the ones worth keeping.
          cache: false

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Verify the libc pin
        # modernc.org/sqlite is transpiled against one exact modernc.org/libc
        # (see "Fragile modernc.org/libc dependency" in its package doc), and
        # go get -u moves libc past it.
        run: |
          sqlite="$(go list -m -f '{{.Version}}' modernc.org/sqlite)"
          want="$(go mod graph | awk -v s="modernc.org/sqlite@$sqlite" \
            '$1 == s && $2 ~ /^modernc\.org\/libc@/ { sub(/.*@/, "", $2); print $2 }')"
          have="$(go list -m -f '{{.Version}}' modernc.org/libc)"
          if [ "$have" != "$want" ]; then
            echo "modernc.org/libc is $have, but modernc.org/sqlite $sqlite requires exactly ${want:-(none found)}"
            exit 1
          fi

      - name: Vet and build every release target
        # The targets in .goreleaser.yaml. Vet type-checks the tests as well.
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/waxbin
          done

      - name: Vet and build the BSDs
        # Nothing ships for these and no test runs on them, so this is all that keeps a
        # host's BSD build compiling. One architecture each: the files that differ are
        # per OS. modernc.org/sqlite builds on all three.
        run: |
          for target in freebsd/amd64 openbsd/amd64 netbsd/amd64; do
            echo "$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/waxbin
          done

      - name: Vet the memory audit harness
        # store/sqlite/memaudit_test.go builds only under libc.memgrind, which nothing
        # else here compiles, so a libc bump that renames the calls it makes would
        # otherwise surface only when the manual audit runs.
        run: go vet -tags=libc.memgrind ./store/sqlite/

      - name: No-CGO invariant
        # No package outside the standard library may carry cgo files. The race
        # tests need cgo on, so such a package would be tested on a path the
        # shipped binaries never take.
        run: |
          for goos in linux darwin windows; do
            pkgs="$(CGO_ENABLED=1 GOOS="$goos" go list -deps -test \
              -f '{{if and .CgoFiles (not .Standard)}}{{.ImportPath}}{{end}}' ./...)"
            if [ -n "$pkgs" ]; then
              echo "Packages with cgo files on $goos:"; echo "$pkgs"; exit 1
            fi
          done

      - name: staticcheck
        # Per OS, so the Windows-only files are checked too. Installed first, since
        # go run under another GOOS would build staticcheck itself for that OS.
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          for goos in linux darwin windows; do
            echo "$goos"
            GOOS="$goos" staticcheck ./...
          done

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  test:
    name: Test (${{ matrix.os }})
    strategy:
      # Let each leg report on its own; a Windows- or macOS-only failure is a real
      # signal (chmod, flock, clock, and filesystem semantics all differ there), not
      # a reason to cancel the Linux run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          go-download-base-url: https://go.dev/dl
          token: ""

      - name: Filesystem fixtures (Linux)
        # btrfs subvolumes and ZFS datasets for the tests of devices that share one
        # pool of space (internal/fsx, inbox). The tests read the layouts these
        # variables name, skip where one is unset, and fail where it is set and broken.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q btrfs-progs zfsutils-linux
          base="$RUNNER_TEMP/waxbin-fs"
          mkdir -p "$base/btrfs/top" "$base/btrfs/b"

          # btrfs on a loop device: subvolumes a and b at the top level, and b mounted
          # again on its own, the usual layout.
          truncate -s 256M "$base/btrfs.img"
          loop="$(sudo losetup --find --show "$base/btrfs.img")"
          sudo mkfs.btrfs -q "$loop"
          sudo mount "$loop" "$base/btrfs/top"
          sudo btrfs subvolume create "$base/btrfs/top/a"
          sudo btrfs subvolume create "$base/btrfs/top/b"
          sudo mount -o subvol=b "$loop" "$base/btrfs/b"
          echo "WAXBIN_TEST_BTRFS=$base/btrfs" >> "$GITHUB_ENV"

          # ZFS, which takes a file as a vdev: pool waxbina with datasets a, b, and held and
          # held2 (each under a quota); a second pool, waxbinb; and waxbinc, whose top
          # dataset is not mounted, holding x and y under like quotas. ZFS keeps at least
          # 128M of a pool back, so the pools imports are tried on are 1G (sparse).
          sudo modprobe zfs
          truncate -s 1G "$base/waxbina.img" "$base/waxbinc.img"
          truncate -s 128M "$base/waxbinb.img"
          sudo zpool create -m "$base/zfs/waxbina" waxbina "$base/waxbina.img"
          sudo zfs create waxbina/a
          sudo zfs create waxbina/b
          sudo zfs create -o quota=64M waxbina/held
          sudo zfs create -o quota=64M waxbina/held2
          sudo zpool create -m "$base/zfs/waxbinb" waxbinb "$base/waxbinb.img"
          sudo zpool create -O canmount=off -m "$base/zfs/waxbinc" waxbinc "$base/waxbinc.img"
          sudo zfs create -o quota=64M waxbinc/x
          sudo zfs create -o quota=64M waxbinc/y
          echo "WAXBIN_TEST_ZFS=$base/zfs" >> "$GITHUB_ENV"

      - name: Filesystem fixture (macOS)
        # Two APFS volumes of one container on a disk image, for the same tests.
        if: runner.os == 'macOS'
        run: |
          base="$RUNNER_TEMP/waxbin-apfs"
          mkdir -p "$base/a" "$base/b"
          hdiutil create -size 256m -fs APFS -volname waxbina "$RUNNER_TEMP/waxbin-apfs.dmg"
          hdiutil attach -nobrowse -mountpoint "$base/a" "$RUNNER_TEMP/waxbin-apfs.dmg"
          # The volume is diskNsM, and its container diskN.
          volume="$(df "$base/a" | awk 'NR == 2 { print $1 }')"
          container="${volume#/dev/}"
          container="${container%s*}"
          sudo diskutil apfs addVolume "$container" APFS waxbinb -mountpoint "$base/b"
          # Spotlight writing to a volume between two reads of its room would fail the
          # check that both report the container's; where it cannot be turned off it is
          # left on.
          sudo mdutil -i off "$base/a" "$base/b" || true
          echo "WAXBIN_TEST_APFS=$base" >> "$GITHUB_ENV"

      - name: Test (race)
        # The race detector needs cgo; scope it to the test toolchain only so the
        # shipped binaries stay pure no-CGO. -count=1 because the restored build
        # cache would otherwise hand back earlier test results. -race also turns on
        # checkptr, which stays on for WaxBin's own code; modernc's transpiled SQLite
        # keeps its memory outside the Go heap, where checkptr checks nothing and
        # still costs about a quarter of each store-heavy package's CPU.
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -gcflags='modernc.org/...=-d=checkptr=0' ./...

      - name: The filesystem tests ran
        # Plain go test prints nothing for a skipped test, so a fixture that stopped
        # being made, or a variable misspelled, would leave these skipping unseen.
        if: runner.os != 'Windows'
        run: |
          # Each test is named, so one renamed out of the pattern is missed loudly.
          case "$RUNNER_OS" in
            Linux) tests="TestPoolOnBtrfs TestPoolOnZFS TestPreflightPlanOnBtrfs TestPreflightPlanOnZFS" ;;
            macOS) tests="TestPoolOnAPFS TestKqueueReportsChanges TestKqueueReportsUnderALinkedRoot
              TestKqueueHoldsADescriptorAFolder TestKqueueEndsTheSessionWhenDescriptorsRunOut
              TestKqueueReportsAnEjectedVolumeOnce" ;;
          esac
          go test -count=1 -v -run 'OnBtrfs$|OnZFS$|OnAPFS$|^TestKqueue' \
            ./internal/fsx/ ./inbox/ ./watch/ | tee "$RUNNER_TEMP/fstests.txt"
          if grep -- '--- SKIP' "$RUNNER_TEMP/fstests.txt"; then
            echo "A filesystem test skipped"; exit 1
          fi
          for test in $tests; do
            if ! grep -q -- "^--- PASS: $test (" "$RUNNER_TEMP/fstests.txt"; then
              echo "$test did not pass"; exit 1
            fi
          done

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          go-download-base-url: https://go.dev/dl
          token: ""
          cache: false

      - name: govulncheck
        # What is reachable differs by OS, so scan each one that ships.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for goos in linux darwin windows; do
            echo "$goos"
            GOOS="$goos" govulncheck ./...
          done
