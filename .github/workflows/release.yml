name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser reads the earlier tags to find the previous release.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          check-latest: true
          # Release binaries come from a clean build.
          cache: false

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
